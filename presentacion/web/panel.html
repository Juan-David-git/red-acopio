<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Red Acopio - Panel</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <script src="/js/iconos.js"></script>

  <header class="barra">
    <a class="logo" href="/">
      <svg aria-hidden="true"><use href="#i-logo"></use></svg>
      <span>Red<em>Acopio</em></span>
    </a>
  </header>

  <main class="contenedor">
    <div class="tarjeta">
      <div class="tarjeta-titulo">
        <svg class="ico" aria-hidden="true"><use href="#i-centro"></use></svg>
        <div>
          <h2 id="saludo">Cargando…</h2>
          <p id="detalle"></p>
        </div>
      </div>
      <p class="ayuda" style="margin: 16px 0 24px">El panel del centro de acopio está en construcción.</p>
      <button id="boton-salir" class="boton secundario ancho" type="button">
        <svg class="ico" aria-hidden="true"><use href="#i-salir"></use></svg>
        Cerrar sesión
      </button>
    </div>
  </main>

  <script src="/js/panel.js"></script>
</body>
</html>
