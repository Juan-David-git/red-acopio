<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Red Acopio - Iniciar sesión</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>

  <header class="barra"><a href="/">Red Acopio</a></header>

  <main class="contenedor">
    <h1>Iniciar sesión</h1>
    <p class="subtitulo">Entre con su correo y contraseña.</p>

    <div id="mensaje" class="mensaje"></div>

    <form id="form-login" class="tarjeta">
      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" placeholder="nombre@correo.com">

      <label for="clave">Contraseña</label>
      <input type="password" id="clave">

      <button type="submit" class="boton ancho">Entrar</button>
    </form>

    <p class="centrado">¿No tiene cuenta? <a href="/registro.html">Regístrese aquí</a></p>
  </main>

  <script src="/js/login.js"></script>
</body>
</html>
