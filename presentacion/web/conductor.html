<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Red Acopio - Conductor</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>

  <header class="barra barra-usuario">
    <a href="/">Red Acopio</a>
    <span id="nombre-usuario"></span>
    <button id="boton-salir" class="boton-salir">Salir</button>
  </header>

  <main class="contenedor">

    <!-- pestañas -->
    <div class="pestanas">
      <button type="button" class="activa" data-seccion="seccion-recoger">Por recoger</button>
      <button type="button" data-seccion="seccion-entregas">Mis entregas</button>
      <button type="button" data-seccion="seccion-horarios">Horarios</button>
    </div>

    <div id="mensaje" class="mensaje"></div>

    <!-- ===== POR RECOGER: donaciones publicadas ===== -->
    <section id="seccion-recoger">
      <p class="subtitulo">Donaciones esperando conductor. Si puede llevar una, toque «Aceptar recogida».</p>
      <div id="lista-recoger"></div>
    </section>

    <!-- ===== MIS ENTREGAS (RF005 y RF006) ===== -->
    <section id="seccion-entregas" class="oculto">
      <h2>Pendientes por entregar</h2>
      <div id="lista-pendientes"></div>

      <h2>Entregas completadas</h2>
      <div id="lista-completadas"></div>
    </section>

    <!-- ===== HORARIOS (RF020) ===== -->
    <section id="seccion-horarios" class="oculto">
      <form id="form-horarios" class="tarjeta">
        <h2>Mi disponibilidad</h2>

        <label class="check">
          <input type="checkbox" id="disponible">
          <strong>Estoy disponible para recoger donaciones</strong>
        </label>

        <label>¿En qué horarios puede recoger?</label>
        <label class="check"><input type="checkbox" name="franja" value="mañana"> Mañana (6 a. m. a 12 m.)</label>
        <label class="check"><input type="checkbox" name="franja" value="tarde"> Tarde (12 m. a 6 p. m.)</label>
        <label class="check"><input type="checkbox" name="franja" value="noche"> Noche (6 p. m. a 9 p. m.)</label>

        <p class="ayuda">Si no está disponible, no podrá aceptar recogidas nuevas.</p>

        <button type="submit" class="boton ancho">Guardar horarios</button>
      </form>
    </section>

  </main>

  <script src="/js/comun.js"></script>
  <script src="/js/conductor.js"></script>
</body>
</html>
