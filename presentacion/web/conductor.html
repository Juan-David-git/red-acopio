<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Red Acopio - Conductor</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <script src="/js/iconos.js"></script>

  <header class="barra barra-usuario">
    <a class="logo" href="/">
      <svg aria-hidden="true"><use href="#i-logo"></use></svg>
      <span>Red<em>Acopio</em></span>
    </a>
    <a class="usuario" href="/perfil.html" title="Mi perfil">
      <span class="avatar"><svg class="ico" aria-hidden="true"><use href="#i-usuario"></use></svg></span>
      <span id="nombre-usuario"></span>
    </a>
    <a class="boton-salir" href="/centros.html" title="Centros de acopio">
      <svg class="ico" aria-hidden="true"><use href="#i-centro"></use></svg>
      <span>Centros</span>
    </a>
    <button id="boton-salir" class="boton-salir" type="button">
      <svg class="ico" aria-hidden="true"><use href="#i-salir"></use></svg>
      <span>Salir</span>
    </button>
  </header>

  <main class="contenedor">

    <!-- pestañas -->
    <div class="pestanas">
      <button type="button" class="activa" data-seccion="seccion-recoger">
        <svg class="ico" aria-hidden="true"><use href="#i-caja"></use></svg> Recoger
      </button>
      <button type="button" data-seccion="seccion-entregas">
        <svg class="ico" aria-hidden="true"><use href="#i-camion"></use></svg> Entregas
      </button>
      <button type="button" data-seccion="seccion-horarios">
        <svg class="ico" aria-hidden="true"><use href="#i-reloj"></use></svg> Horarios
      </button>
      <button type="button" data-seccion="seccion-resumen">
        <svg class="ico" aria-hidden="true"><use href="#i-grafica"></use></svg> Resumen
      </button>
    </div>

    <div id="mensaje" class="mensaje" role="alert"></div>

    <!-- ===== POR RECOGER: donaciones publicadas ===== -->
    <section id="seccion-recoger">
      <p class="subtitulo">Donaciones esperando conductor. Si puede llevar una, toque «Aceptar recogida».</p>

      <!-- cercania: desde su punto de partida (perfil) o su ubicacion de ahora -->
      <div class="filtro-zona tarjeta">
        <p id="texto-zona" class="mapa-estado"></p>
        <div class="filtro-zona-controles">
          <div class="chips" role="group" aria-label="Qué donaciones mostrar">
            <button type="button" class="chip activa" data-alcance="cerca">Cerca de mí</button>
            <button type="button" class="chip" data-alcance="todas">Todas</button>
          </div>
          <button type="button" id="boton-aqui" class="boton secundario">
            <svg class="ico" aria-hidden="true"><use href="#i-pin"></use></svg>
            Usar dónde estoy ahora
          </button>
        </div>
      </div>

      <div id="lista-recoger"></div>
    </section>

    <!-- ===== MIS ENTREGAS (RF005 y RF006) ===== -->
    <section id="seccion-entregas" class="oculto">
      <h2 class="titulo-seccion">
        <svg class="ico" aria-hidden="true"><use href="#i-camion"></use></svg>
        Pendientes por entregar
      </h2>
      <div id="lista-pendientes"></div>

      <h2 class="titulo-seccion">
        <svg class="ico" aria-hidden="true"><use href="#i-check"></use></svg>
        Entregas completadas
      </h2>
      <div id="lista-completadas"></div>
    </section>

    <!-- ===== RESUMEN / ESTADISTICAS (lo dibuja estadisticas.js) ===== -->
    <section id="seccion-resumen" class="oculto">
      <div id="resumen"></div>
    </section>

    <!-- ===== HORARIOS (RF020) ===== -->
    <section id="seccion-horarios" class="oculto">
      <form id="form-horarios" class="tarjeta">
        <div class="tarjeta-titulo">
          <svg class="ico" aria-hidden="true"><use href="#i-reloj"></use></svg>
          <div>
            <h2>Mi disponibilidad</h2>
            <p>Cuéntenos cuándo puede recoger donaciones.</p>
          </div>
        </div>

        <label class="check" style="margin-top: 20px">
          <input type="checkbox" id="disponible">
          <strong>Estoy disponible para recoger donaciones</strong>
        </label>

        <label>
          <svg class="ico" aria-hidden="true"><use href="#i-calendario"></use></svg>
          ¿En qué horarios puede recoger?
        </label>
        <label class="check"><input type="checkbox" name="franja" value="mañana"> Mañana (6 a. m. a 12 m.)</label>
        <label class="check"><input type="checkbox" name="franja" value="tarde"> Tarde (12 m. a 6 p. m.)</label>
        <label class="check"><input type="checkbox" name="franja" value="noche"> Noche (6 p. m. a 9 p. m.)</label>

        <p class="ayuda">Si no está disponible, no podrá aceptar recogidas nuevas.</p>

        <button type="submit" class="boton verde ancho" style="margin-top: 24px">
          <svg class="ico" aria-hidden="true"><use href="#i-check"></use></svg>
          Guardar horarios
        </button>
      </form>
    </section>

  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/comun.js"></script>
  <script src="/js/mapa.js"></script>
  <script src="/js/estadisticas.js"></script>
  <script src="/js/conductor.js"></script>
</body>
</html>
